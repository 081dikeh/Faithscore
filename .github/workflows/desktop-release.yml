name: Build desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build-script: electron:build:win
          - os: macos-latest
            platform: mac
            build-script: electron:build:mac
          - os: ubuntu-latest
            platform: linux
            build-script: electron:build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build desktop app
        run: npm run ${{ matrix.build-script }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: faithscore-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
